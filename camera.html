<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Capture Image</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>

<style>

    #capture-btn{
        width:100px;
        height:100px;
        border-radius:50px;
        background:black;
        color:white;
        font-weight:bolder;
        margin:0 auto;
    }

    #camera-container{
        width:40%;
        text-align:center;
        float:left;
    }
    /* Container to stack layers perfectly */
    .camera-viewport {
        position: relative;
        width: 360px;
        height: 640px;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        margin:0 auto;
    }
.container{
    width:40%;
    float:left;
}
    /* Make video fill the entire container */
    #webcam {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* The visual overlay guide overlay */
    .framing-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none; /* Allows users to still click items beneath it if needed */
    }

    /* The Receipt Scanner Target Box */
    .receipt-target-box {
        width: 70%;
        height: 80%;
        border: 2px dashed #00ff66; /* Bright neon green outline */
        border-radius: 8px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* Dims everything outside the box */
        position: relative;
    }

    /* Tiny helpful instructional message text */
    .receipt-target-box::after {
        content: "ALIGN RECEIPT WITHIN BORDERS";
        position: absolute;
        bottom: -30px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #00ff66;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px #000;
    }
</style>
</head>
<body>
<!-- Update your layout markup to match -->
 <div id="camera-container">
<div class="camera-viewport">
    <video id="webcam" autoplay playsinline></video>
    <div class="framing-overlay">
        <div class="receipt-target-box"></div>
    </div>
</div>
<br />
    <button id="capture-btn">Capture Photo</button>
</div>
<div class="container">
    <div class="view-box">
        <div>
            <h3>Live Camera Feed</h3>
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div>
            <h3>Captured Snapshot</h3>
            <img id="snapshot" alt="Your captured image will appear here">
        </div>
    </div>
    

    
    <!-- Hidden canvas element used to process the image frame -->
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Place this below your capture button -->
<div style="margin-top: 20px; width: 320px; text-align: left;">
    <p><strong>Status:</strong> <span id="ocr-status">Ready</span></p>
    <h3>Extracted Text:</h3>
    <pre id="ocr-result" style="background: #eee; padding: 10px; border-radius: 5px; white-space: pre-wrap; min-height: 50px;"></pre>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
