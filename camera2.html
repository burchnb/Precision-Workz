<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Flash-Lite Receipt Scanner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .box { display: flex; flex-direction: column; gap: 1rem; }
    pre { background: #f4f4f5; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Receipt Scanner (Gemini 3.5 Flash-Lite)</h2>
  <div class="box">
    <input type="password" id="apiKey" placeholder="Paste your Google AI Studio API Key" />
    <input type="file" id="receiptInput" accept="image/*" />
    <button id="scanBtn">Scan Receipt</button>
    <pre id="output">Results will appear here...</pre>
  </div>

  <script type="module">
    import { GoogleGenAI, Type } from "https://esm.sh";

    const scanBtn = document.getElementById("scanBtn");
    const output = document.getElementById("output");

    // Helper: Convert uploaded image file to Base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    scanBtn.addEventListener("click", async () => {
      //const apiKey = document.getElementById("apiKey").value.trim();
      const apiKey = "AQ.Ab8RN6KxpNYiTAXpbQKneZ5oJ84sZkPB7wvurLHw6PZeWhQN6Q"
      const file = document.getElementById("receiptInput").files[0];

      if (!apiKey || !file) {
        output.textContent = "Please enter an API key and select an image.";
        return;
      }

      output.textContent = "Scanning receipt...";

      try {
        const ai = new GoogleGenAI({ apiKey });
        const base64Data = await fileToBase64(file);

        // Enforce strict JSON output structure
        const receiptSchema = {
          type: Type.OBJECT,
          properties: {
            vendor: { type: Type.STRING, description: "Store or merchant name" },
            date: { type: Type.STRING, description: "YYYY-MM-DD format if visible" },
            total: { type: Type.NUMBER, description: "Final total paid" },
            tax: { type: Type.NUMBER, description: "Total tax amount" },
            items: {
              type: Type.ARRAY,
              items: {
                type: Type.OBJECT,
                properties: {
                  name: { type: Type.STRING },
                  price: { type: Type.NUMBER },
                  quantity: { type: Type.NUMBER }
                },
                required: ["name", "price"]
              }
            }
          },
          required: ["vendor", "total", "items"]
        };

        const response = await ai.models.generateContent({
          model: "gemini-3.5-flash-lite",
          contents: [
            {
              inlineData: {
                data: base64Data,
                mimeType: file.type
              }
            },
            "Extract the receipt details. Never invent items not visible on the receipt; skip unreadable lines."
          ],
          config: {
            responseMimeType: "application/json",
            responseSchema: receiptSchema
          }
        });

        // Parse and display formatted JSON
        const parsedData = JSON.parse(response.text);
        output.textContent = JSON.stringify(parsedData, null, 2);

      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
